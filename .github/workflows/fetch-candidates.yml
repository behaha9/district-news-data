name: 抓取網站候選清單

# 在每次 Claude 排程整理之前，先把網站的候選新聞清單存進 inputs/，
# 讓整理流程直接讀檔案，不必在執行時連網站。
on:
  schedule:
    # GitHub 排程可能延遲或跳過，因此每天 05:23–16:23（臺北）每小時抓一次（備援；整理前也會即時請求重抓），
    # 確保 07:16、12:16、16:49 的整理都有 1～2 小時內的清單。
    - cron: "23 21-23 * * *"  # 臺北 每天 05:23、06:23、07:23
    - cron: "23 0-8 * * *"    # 臺北 每天 08:23–16:23
  workflow_dispatch:
    inputs:
      slice:
        description: "本次查詢幾處重點商圈（預設 100）"
        required: false
        default: "100"
  push:
    branches: [main]
    # 整理流程推送 requests/fetch.txt 時立即重抓（GitHub 排程常被延遲或跳過）
    paths: [".github/workflows/fetch-candidates.yml", "requests/fetch.txt"]

permissions:
  contents: write

concurrency:
  group: fetch-candidates
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: 抓取候選清單
        run: |
          set -u
          base="https://business-district-monitor.behaha.chatgpt.site/api/public/v1"
          : > inputs/fetch-log.txt
          fetch() {
            url="$1"; out="$2"
            for attempt in 1 2 3 4; do
              code=$(curl -sS --max-time 40 -A "district-news-data-fetcher/1.0 (+https://github.com/behaha9/district-news-data)" \
                -D "$out.hdr" -o "$out.tmp" -w "%{http_code}" "$url" 2>>inputs/fetch-log.txt || echo "000")
              echo "$(date -u +%H:%M:%S) attempt=$attempt code=$code url=$url bytes=$(wc -c < "$out.tmp" 2>/dev/null || echo 0)" >> inputs/fetch-log.txt
              if [ "$code" = "200" ] && python3 -c "import json,sys; d=json.load(open(sys.argv[1])); assert isinstance(d.get('items'), list)" "$out.tmp" 2>>inputs/fetch-log.txt; then
                mv "$out.tmp" "$out"; rm -f "$out.hdr"; return 0
              fi
              grep -iE "^(server|cf-ray|cf-mitigated|retry-after|content-type):" "$out.hdr" >> inputs/fetch-log.txt 2>/dev/null || true
              head -c 300 "$out.tmp" >> inputs/fetch-log.txt 2>/dev/null || true; echo >> inputs/fetch-log.txt
              sleep 20
            done
            rm -f "$out.tmp" "$out.hdr"; return 1
          }
          fetch "$base/candidates?window=2d" inputs/candidates.json || true
          # 重點商圈每日查詢：每次輪流查 100 處（Bing 新聞，精確名稱），結果存 inputs/district_news.json
          DISTRICT_SLICE="${{ github.event.inputs.slice || '100' }}" timeout 280 python3 scripts/fetch_district_news.py 2>>inputs/fetch-log.txt | tee -a inputs/fetch-log.txt || true
          # Google 新聞補充：Bing 收錄落後時的第二來源；只存標題、時間、媒體名與還原後的原文網址
          timeout 170 python3 scripts/fetch_google_news.py 2>>inputs/fetch-log.txt | tee -a inputs/fetch-log.txt || true
          # 關注議題（reference/topics.json，例如油價）：只收標題同時有議題詞與店家相關詞的新聞
          timeout 120 python3 scripts/fetch_topics.py 2>>inputs/fetch-log.txt | tee -a inputs/fetch-log.txt || true
          # 原文預抓：只存發布時間、站名、官方摘要、內文提到的縣市／重點商圈次數與分享預覽圖網址，不存內文、不下載圖片
          timeout 150 python3 scripts/fetch_articles.py 2>>inputs/fetch-log.txt | tee -a inputs/fetch-log.txt || true
          python3 - <<'PY2'
          import json, os
          from datetime import datetime, timezone, timedelta
          now = datetime.now(timezone(timedelta(hours=8))).replace(microsecond=0).isoformat()
          status = {"fetched_at": now, "files": {}}
          for name in ("candidates.json", "district_news.json", "google_news.json", "topics.json", "articles.json", "thumbs.json"):
              path = f"inputs/{name}"
              if os.path.exists(path) and os.path.getmtime(path) > datetime.now().timestamp() - 600:
                  data = json.load(open(path))
                  status["files"][name] = len(data["items"] if "items" in data else data.get("articles", data.get("images", data.get("topics", {}))))
          json.dump(status, open("inputs/status.json", "w"), ensure_ascii=False, indent=1)
          print(status)
          PY2
          # 自我檢查：整理新聞要用的候選清單程式必須能跑完（0＝正常、2＝清單過舊），其他結束碼代表程式壞了
          python3 scripts/filter_candidates.py > /dev/null 2>>inputs/fetch-log.txt; code=$?
          echo "$(date -u +%H:%M:%S) filter_candidates exit=$code" >> inputs/fetch-log.txt
          if [ "$code" != "0" ] && [ "$code" != "2" ]; then echo "::warning::filter_candidates.py 失敗（exit=$code），整理新聞會讀不到完整候選清單"; fi

      - name: 提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inputs/
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "inputs: 候選清單更新 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0; sleep 10; done
          exit 1
