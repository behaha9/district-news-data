name: 抓取網站候選清單

# 在每次 Claude 排程整理之前，先把網站的候選新聞與 PTT 清單存進 inputs/，
# 讓整理流程直接讀檔案，不必在執行時連網站。
on:
  schedule:
    # GitHub 排程可能延遲或跳過，因此工作日 05:23–16:23（臺北）每小時抓一次，
    # 確保 07:16、12:16、16:49 的整理都有 1～2 小時內的清單。
    - cron: "23 21-23 * * 0-4"  # 臺北 週一至週五 05:23、06:23、07:23
    - cron: "23 0-8 * * 1-5"    # 臺北 週一至週五 08:23–16:23
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/fetch-candidates.yml"]

permissions:
  contents: write

concurrency:
  group: fetch-candidates
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: 抓取候選清單
        run: |
          set -u
          base="https://business-district-monitor.behaha.chatgpt.site/api/public/v1"
          : > inputs/fetch-log.txt
          fetch() {
            url="$1"; out="$2"
            for attempt in 1 2 3 4; do
              code=$(curl -sS --max-time 40 -A "district-news-data-fetcher/1.0 (+https://github.com/behaha9/district-news-data)" \
                -D "$out.hdr" -o "$out.tmp" -w "%{http_code}" "$url" 2>>inputs/fetch-log.txt || echo "000")
              echo "$(date -u +%H:%M:%S) attempt=$attempt code=$code url=$url bytes=$(wc -c < "$out.tmp" 2>/dev/null || echo 0)" >> inputs/fetch-log.txt
              if [ "$code" = "200" ] && python3 -c "import json,sys; d=json.load(open(sys.argv[1])); assert isinstance(d.get('items'), list)" "$out.tmp" 2>>inputs/fetch-log.txt; then
                mv "$out.tmp" "$out"; rm -f "$out.hdr"; return 0
              fi
              grep -iE "^(server|cf-ray|cf-mitigated|retry-after|content-type):" "$out.hdr" >> inputs/fetch-log.txt 2>/dev/null || true
              head -c 300 "$out.tmp" >> inputs/fetch-log.txt 2>/dev/null || true; echo >> inputs/fetch-log.txt
              sleep 20
            done
            rm -f "$out.tmp" "$out.hdr"; return 1
          }
          fetch "$base/candidates?window=2d" inputs/candidates.json || true
          python3 - <<'PY2'
          import json, os
          from datetime import datetime, timezone, timedelta
          now = datetime.now(timezone(timedelta(hours=8))).replace(microsecond=0).isoformat()
          status = {"fetched_at": now, "files": {}}
          for name in ("candidates.json",):
              path = f"inputs/{name}"
              if os.path.exists(path) and os.path.getmtime(path) > datetime.now().timestamp() - 600:
                  status["files"][name] = len(json.load(open(path))["items"])
          json.dump(status, open("inputs/status.json", "w"), ensure_ascii=False, indent=1)
          print(status)
          PY2

      - name: 提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inputs/
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "inputs: 候選清單更新 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0; sleep 10; done
          exit 1
